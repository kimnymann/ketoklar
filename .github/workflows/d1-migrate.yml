name: D1 skema og seed

on:
  push:
    branches: [main]
    paths:
      - 'schema.sql'
      - 'seed_*.sql'
      - '.github/workflows/d1-migrate.yml'
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Hent kode
        uses: actions/checkout@v4

      - name: Installer afhængigheder
        run: npm install

      - name: Kør skema mod D1 (idempotent, fejler ikke hvis tabeller findes)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute DB --remote --file=./schema.sql

      - name: Seed opskrifter (kun nye rækker pga. UNIQUE slug)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute DB --remote --file=./seed_recipes.sql

      - name: Seed opskrifter, batch 2 (kun nye rækker pga. UNIQUE slug)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute DB --remote --file=./seed_recipes_batch2.sql

      - name: Seed artikler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute DB --remote --file=./seed_articles.sql
