<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" role="img" aria-labelledby="title"><title id="title">Tænkt eksempel: 3 g sukkerarter indgår i de 12 g kulhydrat</title><rect width="600" height="430" rx="20" fill="#f4efe5"/><g font-family="Arial, sans-serif" fill="#183c30"><text x="30" y="40" font-size="16" letter-spacing="2">TÆNKT EKSEMPEL · PR. 100 G</text><text x="30" y="84" font-size="28" font-weight="700">Sukkerarter er allerede med</text><rect x="30" y="110" width="540" height="113" rx="12" fill="#fffdf7"/><text x="48" y="148" font-size="25" font-weight="700">Kulhydrat</text><text x="548" y="148" text-anchor="end" font-size="28" font-weight="700">12 g</text><path d="M48 163 H548" stroke="#c8ccbd"/><text x="65" y="198" font-size="23">heraf sukkerarter</text><text x="548" y="198" text-anchor="end" font-size="25">3 g</text><rect x="30" y="248" width="540" height="32" rx="8" fill="#547763"/><path d="M435 248 H562 Q570 248 570 256 V272 Q570 280 562 280 H435Z" fill="#ad5838"/><text x="30" y="311" font-size="20">9 g øvrigt kulhydrat</text><text x="570" y="311" text-anchor="end" font-size="20">3 g sukkerarter</text><text x="30" y="357" font-size="28" font-weight="700">Du tæller 12 g i alt.</text><text x="30" y="393" font-size="22">Ikke kun 3 g – og ikke 12 + 3 g.</text></g></svg>

